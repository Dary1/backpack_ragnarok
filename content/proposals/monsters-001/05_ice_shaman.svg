<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
  <!-- Ice Shaman : robed caster, antlered mask, raised staff with floating shard. Accent: cyan spell orb -->
  <!-- floating spell orb top-right (irregular reach) -->
  <path d="M 196 44 L 202 26 L 210 44 L 228 50 L 210 58 L 202 78 L 196 58 L 178 50 Z" fill="#59d6d6" stroke="#2b2016" stroke-width="3" stroke-linejoin="round"/>
  <!-- staff -->
  <path d="M 188 52 L 150 220" fill="none" stroke="#5f3d22" stroke-width="7" stroke-linecap="round"/>
  <path d="M 188 52 L 150 220" fill="none" stroke="#8a5a33" stroke-width="3" stroke-linecap="round"/>
  <!-- robe (wide skirt, jagged hem = irregular bottom) -->
  <path d="M 96 108 C 118 100 148 104 160 126 L 176 210 L 196 270 L 174 262 L 162 284 L 146 262 L 130 286 L 116 262 L 100 282 L 88 258 L 78 200 L 82 150 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- robe center panel mid-tone -->
  <path d="M 108 130 C 124 124 140 128 148 142 L 156 230 L 118 244 L 100 200 Z" fill="#a5dcef" stroke="none"/>
  <!-- robe trim accent line -->
  <path d="M 100 250 L 118 258 L 132 250 L 146 258 L 162 250" fill="none" stroke="#59d6d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- raised arm to staff -->
  <path d="M 138 150 L 176 116 L 188 128 L 150 162 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- lowered arm -->
  <path d="M 96 150 L 68 196 L 82 204 L 108 160 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- head with mask -->
  <path d="M 100 78 C 118 66 144 70 152 92 C 156 112 142 126 122 126 C 102 126 92 110 94 94 C 95 88 97 82 100 78 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- antlers (irregular top spread) -->
  <path d="M 104 74 C 92 58 82 56 72 42 C 84 50 92 46 100 60" fill="none" stroke="#efe6d2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 108 72 L 100 48 M 100 60 L 84 52" fill="none" stroke="#efe6d2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 146 74 C 158 58 168 56 178 42 C 166 50 158 46 150 60" fill="none" stroke="#efe6d2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 142 72 L 150 48 M 150 60 L 166 52" fill="none" stroke="#efe6d2" stroke-width="4" stroke-linecap="round"/>
  <!-- mask shadow -->
  <path d="M 106 96 C 120 90 138 92 144 102 C 138 114 116 116 106 108 Z" fill="#2b2016" stroke="none"/>
  <!-- ACCENT: cyan mask eyes -->
  <circle cx="118" cy="102" r="4" fill="#59d6d6" stroke="none"/>
  <circle cx="134" cy="102" r="4" fill="#59d6d6" stroke="none"/>
</svg>
