<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300">
  <!-- Ice Wyrm (BOSS) : long serpentine frost dragon, coiling body, finned crest, horned jaw. Accent: cyan maw/eye -->
  <!-- serpentine body: a long S-coil (irregular, boss-scale) -->
  <path d="M 30 250 C 20 210 60 190 100 196 C 150 204 168 230 220 226 C 268 222 280 178 262 150 C 246 124 206 128 196 156 C 188 178 208 190 224 182 C 214 196 190 194 182 176 C 172 150 196 120 232 122 C 280 124 306 164 292 206 C 278 244 226 258 176 248 C 132 240 108 220 78 224 C 54 228 48 244 58 262 C 40 262 30 258 30 250 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="6" stroke-linejoin="round"/>
  <!-- belly scutes lighter tone along inner coil -->
  <path d="M 44 244 C 40 218 70 206 100 210 C 140 216 162 236 206 234 C 200 244 150 240 118 232 C 88 224 62 224 52 244 Z" fill="#a5dcef" stroke="none"/>
  <!-- dorsal fin crest running along the back (irregular sawtooth) -->
  <path d="M 236 124 L 246 100 L 258 130 M 268 140 L 282 118 L 292 148 M 292 178 L 312 168 L 302 196 M 276 224 L 292 224 L 278 244" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- neck rising toward head (upper right) -->
  <path d="M 288 190 C 320 176 356 156 380 120 C 396 96 420 92 440 104 L 428 138 C 410 128 392 138 380 158 C 362 186 330 206 300 212 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 320 190 C 350 172 372 150 388 126 C 396 138 380 164 360 184 C 344 200 328 206 314 208 Z" fill="#a5dcef" stroke="none"/>
  <!-- HEAD (long, horned, open maw = irregular top-right) -->
  <path d="M 416 96 C 440 82 480 82 502 100 C 514 110 512 124 500 128 C 512 132 508 146 494 148 C 476 150 458 146 444 138 C 424 126 410 112 412 102 C 413 99 414 97 416 96 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="6" stroke-linejoin="round"/>
  <!-- horns (irregular top) -->
  <path d="M 424 92 L 414 60 L 438 84 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 452 90 L 456 56 L 472 84 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- lower jaw fang line -->
  <path d="M 452 138 L 460 150 L 468 140 L 476 150 L 484 140" fill="none" stroke="#f2fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- snout light -->
  <path d="M 470 104 C 486 100 500 104 500 114 C 490 120 476 118 468 112 Z" fill="#a5dcef" stroke="none"/>
  <!-- tail tip fin (far left, irregular) -->
  <path d="M 30 250 L 8 236 L 20 254 L 4 262 L 28 264 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- ACCENT: cyan maw glow + eye -->
  <path d="M 486 128 C 498 132 494 144 484 142 C 488 137 486 132 486 128 Z" fill="#59d6d6" stroke="#2b2016" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="458" cy="110" r="5" fill="#59d6d6" stroke="#2b2016" stroke-width="3"/>
  <circle cx="504" cy="112" r="4" fill="#2b2016" stroke="none"/>
</svg>
