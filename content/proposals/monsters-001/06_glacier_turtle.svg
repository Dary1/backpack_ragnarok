<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220">
  <!-- Glacier Turtle : broad shell of jagged ice peaks, stubby legs, low head. Accent: cyan shell glow -->
  <!-- back legs -->
  <path d="M 74 158 L 60 196 L 84 198 L 92 164 Z" fill="#5f6b77" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 250 158 L 262 196 L 286 194 L 274 162 Z" fill="#5f6b77" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 58 194 L 88 194 L 90 202 L 56 202 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 260 192 L 288 192 L 290 200 L 258 200 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="3" stroke-linejoin="round"/>
  <!-- body / underbelly -->
  <path d="M 80 132 C 120 120 220 120 262 132 C 268 158 250 172 210 176 C 170 180 130 180 96 174 C 70 170 74 148 80 132 Z" fill="#5aa9c9" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- tail -->
  <path d="M 262 148 C 284 146 300 152 312 162 C 300 166 288 164 278 158 C 272 154 266 152 262 152 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- head + neck (low, forward) -->
  <path d="M 78 138 C 56 132 34 132 20 142 C 30 152 26 162 40 164 C 56 166 72 158 82 148 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- SHELL: dome of jagged ice peaks (irregular top edge) -->
  <path d="M 72 138 C 84 96 108 74 172 70 C 236 74 258 98 270 138 C 232 128 108 128 72 138 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="6" stroke-linejoin="round"/>
  <!-- ice peaks on shell (irregular ridge) -->
  <path d="M 96 118 L 108 76 L 122 116 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 128 114 L 148 66 L 168 112 Z" fill="#f2fbff" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 174 112 L 196 68 L 214 116 Z" fill="#cfdfea" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 218 118 L 234 80 L 248 122 Z" fill="#f2fbff" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- shell rim mid-tone -->
  <path d="M 80 134 C 120 126 224 126 262 134 C 224 140 120 140 80 134 Z" fill="#a5dcef" stroke="none"/>
  <!-- ACCENT: cyan glow between peaks + eye -->
  <path d="M 148 96 L 156 84 L 164 96 L 158 108 L 152 108 Z" fill="#59d6d6" stroke="#2b2016" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="42" cy="146" r="4" fill="#59d6d6" stroke="#2b2016" stroke-width="2.5"/>
</svg>
