# REQ-0274 drop-in. Stop pinning platform_profile=performance at boot.
# gpu-profile-follow.service now governs the profile dynamically (performance
# only while the GPU is busy). Boot to the quiet "balanced" baseline instead and
# keep NVIDIA persistence mode. The empty ExecStart= clears the unit's inherited
# ExecStart list before redefining it; ExecStartPre (the nvidia-smi -L wait) is
# untouched.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'echo balanced > /sys/firmware/acpi/platform_profile'
ExecStart=-/usr/bin/nvidia-smi -pm 1
