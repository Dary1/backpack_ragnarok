<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300">
  <!-- Frost Archer : cloaked humanoid drawing an ice bow, hood + jagged cloak hem. Accent: cyan arrow/eyes -->
  <!-- bow (tall arc, left) -->
  <path d="M 40 60 C 14 110 14 190 40 240" fill="none" stroke="#a5dcef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 42 62 C 20 110 20 190 42 238" fill="none" stroke="#2b2016" stroke-width="3" stroke-linecap="round"/>
  <!-- bowstring -->
  <path d="M 40 60 L 120 150 L 40 240" fill="none" stroke="#d7dfe6" stroke-width="2.5"/>
  <!-- cloak body (jagged hem = irregular bottom) -->
  <path d="M 108 96 C 128 88 156 92 168 112 L 176 200 L 190 250 L 172 244 L 160 264 L 146 246 L 132 268 L 120 246 L 106 262 L 100 232 L 96 150 Z" fill="#5f6b77" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- cloak inner mid-tone -->
  <path d="M 118 120 C 134 114 150 118 158 132 L 162 210 L 130 222 L 116 190 Z" fill="#7d8b99" stroke="none"/>
  <!-- drawing arm -->
  <path d="M 150 140 L 200 130 L 206 146 L 156 158 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- bow arm -->
  <path d="M 118 138 L 60 148 L 58 132 L 116 122 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- hood / head -->
  <path d="M 112 66 C 132 52 160 56 170 78 C 174 98 160 112 138 114 C 116 116 104 100 106 84 C 107 76 109 70 112 66 Z" fill="#7ecbe8" stroke="#2b2016" stroke-width="5" stroke-linejoin="round"/>
  <!-- hood peak (irregular top) -->
  <path d="M 118 62 L 128 34 L 150 58 Z" fill="#5f6b77" stroke="#2b2016" stroke-width="4" stroke-linejoin="round"/>
  <!-- face shadow -->
  <path d="M 120 84 C 132 78 150 80 158 90 C 152 102 130 104 120 96 Z" fill="#2b2016" stroke="none"/>
  <!-- ACCENT: cyan glowing eyes + nocked ice arrow -->
  <circle cx="132" cy="90" r="4" fill="#59d6d6" stroke="none"/>
  <circle cx="148" cy="90" r="4" fill="#59d6d6" stroke="none"/>
  <path d="M 60 150 L 200 138" fill="none" stroke="#59d6d6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 54 150 L 68 143 L 68 157 Z" fill="#59d6d6" stroke="#2b2016" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
